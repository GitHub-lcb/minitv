name: minitv-local

services:
  mysql:
    image: mysql:8.4
    container_name: minitv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: minitv_root
      MYSQL_DATABASE: minitv
      MYSQL_USER: minitv
      MYSQL_PASSWORD: minitv_local
      TZ: UTC
    # log-bin-trust-function-creators lets the app user create the status-machine
    # triggers even though MySQL enables binary logging by default.
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --log-bin-trust-function-creators=1
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - minitv_mysql:/var/lib/mysql
    networks:
      - minitv
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uminitv", "-pminitv_local"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: minitv-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: minitv_local
    command: ["redis-server", "--requirepass", "minitv_local", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - minitv_redis:/data
    networks:
      - minitv
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  minitv:
    driver: bridge
    ipam:
      config:
        - subnet: 10.88.20.0/24

volumes:
  minitv_mysql:
  minitv_redis:
